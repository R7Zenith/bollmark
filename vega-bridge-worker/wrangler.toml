name = "bollmark-vega-bridge"
main = "worker.js"
compatibility_date = "2026-09-10"
# Vega'nin mevcut "Site Adi" bu adres; kapanirsa stok senkronu durur.
workers_dev = true
# Vega siparis istegini Site Adi'nin basina "www." ekleyerek atiyor gibi;
# workers.dev sertifikasi "www." alt adini kapsamiyor (bkz.
# VEGA_SIPARIS_AKTARIM_PLANI.md). Kendi alanimizda iki ad da sertifikali.
routes = [
  { pattern = "vega.bollmark.com", custom_domain = true },
  { pattern = "www.vega.bollmark.com", custom_domain = true }
]
